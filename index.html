<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Herausforderung der Völker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0f1116;--fg:#e8e6e1;--card:#1a1c23;--ac:#c0281a;--mu:#9a9690;--bd:#2c2f3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--fg:#eceff5;--card:#1e232e;--mu:#98a1b5;--bd:#2f3646}}
:root[data-theme="dark"]{--bg:#14171f;--fg:#eceff5;--card:#1e232e;--mu:#98a1b5;--bd:#2f3646}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:480px;margin:0 auto;padding:12px;box-sizing:border-box}
h1{margin:8px 0 0;color:var(--ac);font-size:28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.rule,.info{color:var(--mu);font-size:14px;margin:6px 0}
.info b{color:var(--fg)}
.h{font-size:22px;font-weight:700}.h small{color:var(--mu);font-weight:400;font-size:14px}
.who{font-weight:700;font-size:18px;margin-top:6px}.who small{color:var(--mu);font-weight:400}
button{display:block;width:100%;margin:8px 0;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:12px;background:var(--ac);color:#fff}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.4}
button.sq{width:56px;margin:0}
.row{display:flex;gap:8px;align-items:center;justify-content:center}.row button{margin:6px 0}
input{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
.dice{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0;min-height:60px}
.die{font-size:44px;line-height:1;width:54px;height:54px;border-radius:11px;border:2px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;user-select:none}
.die.f{border-color:var(--ac);background:rgba(214,54,31,.14)}
.die.s{outline:3px solid #2a7de1}.die.x{opacity:.3}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px 8px;margin:2px;font-size:15px}
.bd{display:flex;gap:6px}.pc{flex:1;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:6px;text-align:center;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pc b{display:block;font-size:20px}.pc.on{border-color:var(--ac)}
.res{text-align:center;font-size:18px;padding:10px;border-radius:10px;background:rgba(46,160,67,.15);margin:8px 0}
.res.bad{background:rgba(214,54,31,.14)}.res b{display:block;font-size:26px}
.cnt{min-width:100px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px;border-bottom:1px solid var(--bd);text-align:center}td:first-child,th:first-child{text-align:left}
summary{cursor:pointer;color:var(--mu);margin:8px 0}
.rk{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:18px}
.die{box-shadow:0 3px 0 var(--bd)}
.roll{animation:roll .6s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes roll{0%{transform:rotate(-260deg) scale(.3) translateY(-40px);opacity:0}60%{transform:rotate(18deg) scale(1.15);opacity:1}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes rise{from{height:0;opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ban{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:#fff;background:linear-gradient(135deg,hsl(var(--hu) 50% 26%),hsl(calc(var(--hu) + 40) 55% 12%))}
.ban .em{font-size:44px;animation:bob 1.6s ease-in-out infinite}.ban .h{color:#fff}.ban small{color:rgba(255,255,255,.85);font-size:13px}
.prog{display:flex;justify-content:space-between;margin:6px 4px 8px;font-size:16px}.prog span{opacity:.3;filter:grayscale(1)}.prog .ok{opacity:1;filter:none}.prog .cur{opacity:1;filter:none;transform:scale(1.35)}
.trophy{font-size:64px;text-align:center;animation:bob 1.4s ease-in-out infinite}.win{text-align:center;font-size:20px;margin:6px 0;animation:pop .6s both}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:16px 0}.col{flex:1;text-align:center;min-width:0}
.nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pt{font-size:20px;font-weight:700;color:var(--ac)}
.blk{border-radius:10px 10px 0 0;display:flex;justify-content:center;font-size:38px;padding-top:6px;box-sizing:border-box;animation:rise .9s ease-out both}
.b0{background:linear-gradient(#ffd54a,#e0a800)}.b1{background:linear-gradient(#e3e6ec,#aab1bf)}.b2{background:linear-gradient(#e0a070,#b06a35)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden}.cf i{position:absolute;top:-16px;width:9px;height:14px;animation:fall linear forwards}
.row input{min-width:0;padding:10px 8px}.nm{white-space:normal;font-size:13px}
.opt{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:15px}.opt input{width:22px;height:22px;margin:0;flex:none}
.stp{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.sc{font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid var(--bd);color:var(--mu)}.sc.ok{border-color:#2ea043;color:var(--fg)}.sc.lose{border-color:var(--ac);color:var(--fg)}.sc.cur{background:var(--ac);border-color:var(--ac);color:#fff}
.brk{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.bcol{flex:0 0 140px;display:flex;flex-direction:column}.bt{font-size:12px;color:var(--mu);text-align:center;margin-bottom:4px}.bm{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:6px}
.mb{border:1px solid var(--bd);border-radius:8px;background:var(--card);font-size:12px;overflow:hidden}.mr{display:flex;justify-content:space-between;gap:4px;padding:3px 6px}.mr span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mr.w{font-weight:700;background:rgba(46,160,67,.18)}.mr.me{outline:2px solid var(--ac);outline-offset:-2px}
.sl{margin:12px 0 4px;font-size:15px}.sl input{border:0;padding:0;margin:8px 0 0;background:none;accent-color:var(--ac)}
.ri{height:1.7em;width:1.7em;object-fit:contain;vertical-align:-.45em;margin-right:2px}
.eff{border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px;font-weight:600;border:2px solid var(--bd)}.eff.pos{background:rgba(46,160,67,.18);border-color:#2ea043}.eff.neg{background:rgba(214,54,31,.14);border-color:var(--ac)}.eff.mix{background:rgba(224,168,0,.18);border-color:#e0a800}
button.rb{width:64px;margin:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;line-height:1.1;flex:0 0 auto}
.pc .ri{height:1.4em;width:1.4em}
</style></head><body><div id="app"></div>

function guide(){return `<details><summary>Kurzanleitung</summary><div class="card" style="font-size:14px"><b>Ziel:</b> In den gewählten Herausforderungen (Standard: die 10 klassischen; mit dem Regler bis zu 14) möglichst viele Punkte sammeln. Wer nach der letzten die meisten hat, gewinnt.<br><br><b>Ablauf:</b> Die Herausforderungen sind unabhängig. Ab der zweiten beginnt der aktuell Führende. Bei mehreren Versuchen kommen erst alle Spieler mit Versuch 1 dran, dann mit Versuch 2 usw. Gewertet wird das beste Ergebnis.<br><br><b>Optionen:</b> „Herausforderungen in zufälliger Reihenfolge“ mischt die zehn Herausforderungen. Bei der Spielerreihenfolge gilt: „Jede Runde auslosen“ (Standard) würfelt die Reihenfolge in jeder Herausforderung neu, „Spitzenreiter startet zuerst“ lässt den Punktbesten beginnen, bei Gleichstand bleibt die Reihenfolge der letzten Herausforderung. „Feste Reihenfolge“ bleibt wie eingetragen. Das gilt für alle Modi. Im Knockout beginnst du bei „Spitzenreiter“ in jedem Duell, weil nur du und dein Gegner spielen.<br><br><b>Gruppen-Knockout:</b> Wie das Knockout, aber in Vierergruppen: Deine Gruppe spielt in jeder Runde dieselbe Herausforderung, die ersten zwei kommen weiter. Im Finale (4 Spieler) gibt es Gold, Silber und Bronze.<br><br><b>Knockout:</b> 16, 32 oder 64 Spieler, nur mit Spieler 1. Die Herausforderung pro Runde folgt der Option (zufällig oder in Standardreihenfolge). Du trittst gegen einen Computer-Gegner an, wer mehr Punkte hat, kommt weiter. Bei Gleichstand gibt es ein Stechen. Die anderen Duelle werden simuliert.<br><br><b>Spieler:</b> Jeder bekommt zufällig ein Fantasy-Volk (Menschen, Zwerge, Elfen, Halblinge, Orks) mit passendem Vornamen; ♂/♀ gilt für alle. das Volk wählst du in der Auswahlliste, den Namen könnt ihr jederzeit ändern, 🎲 mischt neu.<br><br><b>Computer:</b> Aktiviere beim Start bei einem Spieler die Option 🤖. Der Computer würfelt dann automatisch, du siehst sein Ergebnis und tippst auf <i>Weiter</i>. Charakter: <i>vorsichtig</i> nimmt sichere Ergebnisse früh mit, <i>riskant</i> geht auf Höchstwerte und riskiert ungültige Versuche, <i>ausgewogen</i> liegt dazwischen.<br><br><b>Bedienung:</b> Mit <i>Würfeln</i> wirfst du. Beim Festhalten tippst du die gewünschten Würfel an (blau markiert) und bestätigst. Festgehaltene Würfel sind rot umrandet, abgeblasste Würfel sind nicht erlaubt.<br><br><b>Lauf-Herausforderungen (Flucht vor dem Henker, Pfeilhagel, Spießrutenlauf, Todesmarsch, Foltergang, Blutstaffel):</b> Würfel in Sätzen werfen, jeden Satz mit <i>Behalten</i> festlegen oder neu würfeln (insgesamt 5 Neuwürfe, bei der Blutstaffel nur 3). Sechsen zählen minus 6, nur im Foltergang normal.<br><br><b>Sprung in den Abgrund:</b> Anlauf mit 5 Würfeln, Festhaltesumme max. 8, sonst ungültig. Danach springst du mit den festgehaltenen Würfeln und willst hohe Werte.<br><br><b>Knochenbrecher / Kerkerstemmen:</b> Bis zu 8 (Kerker: 6) Würfel nacheinander, jederzeit Stopp. Eine 1 (beim Kerkerstemmen auch eine 2) = ungültig.<br><br><b>Beilwurf / Speer ins Herz / Schädelhammer:</b> Pro Wurf mind. 1 Würfel festhalten: beim Beil nur gerade, beim Speer nur ungerade, beim Hammer nur ab 3. Gibt es keinen erlaubten Würfel, ist der Versuch ungültig.<br><br><b>Die Grube:</b> Du hast 8 Würfel Kraft für vier Gegner (Wolf 7/4, Söldner 10/7, Oger 13/11, Henker 16/16: Stärke/Beute). Wähle einen Gegner und schicke 1 bis 6 Würfel; erreicht die Summe seine Stärke, bekommst du die Beute. Sonst darfst du einzeln Würfel nachlegen oder aufgeben. Eingesetzte Würfel sind verbraucht, jeder Gegner kämpft nur einmal. Rückzug beendet die Herausforderung.<br><br><b>Sprung in die Lanzen:</b> Start bei 10, Schritte von 2. Pro Höhe springen oder auslassen, 3 Versuche. Würfelzahl frei wählbar (max. 8), Summe ≥ Höhe und keine 1. Dreimal gerissen = ausgeschieden.<br><br><b>Völker:</b> Jedes Volk hat Bonus- und Malus-Punkte auf einzelne Herausforderungen (nur bei gültigem Ergebnis) und eine Besonderheit. Sie stehen im Spiel unter dem Spielernamen und gelten auch für Computer-Gegner.<br>${NAT.map((n,i)=>'<i>'+n.r+':</i> '+RB[i]).join('<br>')}<br><br>Mit „Herausforderungen in zufälliger Reihenfolge“ werden alle 14 Herausforderungen gemischt, sonst kommen nach den klassischen zehn die vier zusätzlichen (Pfeilhagel, Blutstaffel, Schädelhammer, Kerkerstemmen).<br><br><b>Freischaltungen:</b> In den Turnieren (Knockout und Gruppen-Knockout) stehen anfangs nur Menschen, 4 Herausforderungen und 16 Teilnehmer zur Verfügung. Ein Erstsieg in jeder Kombination aus Modus und Größe schaltet Völker und Herausforderungen frei. Auch der zweite Platz (Finalist im Knockout, Silber im Gruppen-Knockout) schaltet die Herausforderungen frei, das Volk gibt es nur beim Sieg. Die Größen 32 und 64 öffnen nach einem Sieg in der jeweils kleineren. Das freie Spiel bleibt komplett offen. Der Stand steht unten auf der Startseite.</div></details>`}

  a.innerHTML=h+`<label class="opt"><input type="checkbox" id="rd" ${RD?'checked':''}> Herausforderungen in zufälliger Reihenfolge</label><div class="rule" style="margin:10px 0 0">Spielerreihenfolge</div><label class="opt"><input type="radio" name="ro" value="1" ${RP==1?'checked':''}> Spielerreihenfolge jede Runde auslosen</label><label class="opt"><input type="radio" name="ro" value="2" ${RP==2?'checked':''}> Spitzenreiter startet zuerst</label><label class="opt"><input type="radio" name="ro" value="0" ${RP==0?'checked':''}> Feste Reihenfolge (wie eingetragen)</label><button onclick="start()">Kampf beginnen</button><div class="sl"><label for="nd">Anzahl Herausforderungen: <b id="ndv">${NDu}</b></label><input type="range" id="nd" min="1" max="${D.length}" value="${NDu}" oninput="NDu=+this.value;$('ndv').textContent=NDu"></div>${SMh}<button onclick="koStart(KN)" style="margin-top:16px">⚔️ Knockout: nur einer überlebt</button><button onclick="gStart(KN)">🩸 Gruppen-Knockout: die Arena</button><div class="rule" style="margin:0"><b>Teilnehmer</b> (nur Spieler 1, gegen Computer; Turniere nutzen deine Freischaltungen):</div><div class="row">${[16,32,64].map(n=>`<button class="${KN==n?'':'alt'}" ${sizeOpen(n)?'':'disabled'} onclick="grab();KN=${n};render()">${sizeOpen(n)?'':'🔒 '}${n}</button>`).join('')}</div></div><button class="alt" onclick="mode='hs';render()">☠️ Ruhmeshalle</button>`+unHtml()+guide()+`<div class="info" style="margin-top:18px;text-align:center">Inoffizielle Fan-Umsetzung, die auf der Idee von „Zehnkampf“ von Dr. Reiner Knizia (knizia.de) basiert. Nicht von ihm autorisiert; Regeln, Völker und Herausforderungen sind eigene Anpassungen.</div>`;return}
 if(mode=='hs')return hsScr();if(mode=='gi')return giScr();if(mode=='gr')return grScr();if(mode=='koi')return koiScr();if(mode=='kor')return korScr();

  a.innerHTML=`${ban('Ergebnis')}`+board(-1)+`<div class="card">`+o.map(i=>`<div class="rk"><span>${E(P[i].name)}${BN[i]?` <small style="color:var(--mu)">(Volk ${BN[i]>0?'+':''}${BN[i]})</small>`:''}</span><b>${best[i]}</b></div>`).join('')+`</div><button onclick="nextD()">${d==ND-1?'Endergebnis':'Nächste Herausforderung'}</button>${OFF?'<button class="alt" onclick="corr()">Eingabe korrigieren</button>':''}`+table();return}
 if(mode=='end')return endScr();
 if(0){const o=P.map((_,i)=>i).sort((x,y)=>tot(y)-tot(x));
  a.innerHTML=`<h1>Endergebnis</h1><div class="card">`+o.map((i,k)=>`<div class="rk"><span>${['🥇','🥈','🥉','4.'][k]} ${E(P[i].name)}</span><b>${tot(i)}</b></div>`).join('')+`</div>`+table()+`<button onclick="mode='setup';render()">Neuer Kampf</button>`;return}
 const c=D[d],jm=c.t=='hj'||c.t=='pv',p=jm?J.act[J.pos]:q[qi][0];let dh,ct;
 if(jm){if(P[p].cpu&&J.ph=='choose')cpuJ();[dh,ct]=rJ()}else{if(st.cpu)dh=st.cpu;else[dh,ct]=c.t=='sets'?rSE():c.t=='sp'?rSP():c.t=='pit'?rPit():rFZ();
  if(st.res)ct=`<div class="res ${st.res.v?'':'bad'}">${st.res.msg?st.res.msg+'<br>':''}<b>${st.res.v} Punkte</b>${bnPre(p,st.res.v)}</div><button onclick="nx()">Weiter</button>${heroOk(p)?'<button class="alt" onclick="hero()">🛡️ Heldenmut: Versuch wiederholen</button>':''}`}
 a.innerHTML=`${ban(KO?rname(KO.A.length):GK?gname(GK.G.length*4):'')}<div class="rule">${c.r}</div>`+board(p)+hiLine(p)+`<div class="card"><div class="who">${E(P[p].name)} <small>${!jm&&A>1?'· Versuch '+(q[qi][1]+1)+'/'+A+' · ':'· '}bisher ${best[p]}</small></div><div class="info" style="margin:2px 0 6px;font-size:12px">${P[p].rc!=null?'<b>'+NAT[P[p].rc].r+'</b> · '+RB[P[p].rc]:''}</div>${rmBadge(p)}${dh}${ct}${vbtn(p)}</div>`+table()}
